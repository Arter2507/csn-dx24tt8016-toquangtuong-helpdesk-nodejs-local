<a class="skip-link" href="#main-content">Đến nội dung</a>
<header class="topbar">
  <button class="mobile-menu" type="button" aria-controls="sidebar" [attr.aria-expanded]="menuOpen()" (click)="menuOpen.set(!menuOpen())">
    <i class="bi bi-list" aria-hidden="true"></i> Menu
  </button>
  <a class="brand" routerLink="/"><span class="brand-icon"><i class="bi bi-headset" aria-hidden="true"></i></span> Helpdesk</a>
  <span class="topbar-description">Trung tâm hỗ trợ kỹ thuật</span>
  <details class="account-menu" #account (keydown.escape)="account.open = false; accountButton.focus()">
    <summary #accountButton><i class="bi bi-person-circle" aria-hidden="true"></i> Không gian demo <i class="bi bi-chevron-down" aria-hidden="true"></i></summary>
    <div class="account-links">
      <a routerLink="/profile" (click)="account.open = false">Hồ sơ</a>
      <a routerLink="/notifications" (click)="account.open = false">Thông báo</a>
    </div>
  </details>
</header>
<div class="layout">
  <aside id="sidebar" [class.open]="menuOpen()">
    <nav aria-label="Điều hướng chính">
      @for (group of groups; track group.label) {
        <p class="nav-label">{{ group.label }}</p>
        @for (link of group.links; track link.path) {
          <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: link.path === '/' }" ariaCurrentWhenActive="page" (click)="menuOpen.set(false)">
            <i class="bi" [class]="link.icon" aria-hidden="true"></i>{{ link.label }}
          </a>
        }
      }
    </nav>
  </aside>
  <main id="main-content" tabindex="-1"><router-outlet /></main>
</div>
