name: tram-meo-production

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-helpdesk}"
      MYSQL_USER: "${MYSQL_USER:-helpdesk_app}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 24

  backend:
    build:
      context: ../src/backend
      dockerfile: ../../docker/backend.Dockerfile
    init: true
    restart: unless-stopped
    command: ["sh", "-c", "node scripts/docker-init-db.js && exec node src/server.js"]
    environment:
      NODE_ENV: production
      DATA_SOURCE: mysql
      HOST: 0.0.0.0
      PORT: "3000"
      DB_HOST: db
      DB_NAME: "${MYSQL_DATABASE:-helpdesk}"
      DB_USER: "${MYSQL_USER:-helpdesk_app}"
      DB_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      CORS_ORIGIN: "${PUBLIC_ORIGIN:-https://${APP_DOMAIN:?Set APP_DOMAIN}}"
      MYSQL_SEED_SAMPLE: "false"
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_LANGUAGE: "${MAIL_LANGUAGE:-vi}"
      INBOUND_MAIL_TOKEN: "${INBOUND_MAIL_TOKEN:-}"
      INBOUND_MAIL_CATEGORY_ID: "${INBOUND_MAIL_CATEGORY_ID:-0}"
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/auth/mode').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24

  frontend:
    build:
      context: ../src/frontend
      dockerfile: ../../docker/frontend.Dockerfile
      target: production
    restart: unless-stopped
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?Set APP_DOMAIN}"
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  uploads:
  backups:
  caddy_data:
  caddy_config:
